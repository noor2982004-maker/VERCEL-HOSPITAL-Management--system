$kind: http-request
name: Health Check
order: 2000
url: '{{baseUrl}}/'
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });
